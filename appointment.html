<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Appoinment</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome
/6.7.2/css/all.min.css">
</head>
<body>

        <h1 id="containerII" class="scroll-reveal">
            BOOK AN APPOINTMENT
        </h1>
        <p class="p">
            Schedule your appointment with Blinx Aesthetics. <br>
            Fill in the details to confirm your appointment.
        </p>
        <form action="https://formspree.io/f/meeywqgj" method="POST" class="appointment-form">
            <input type="text" name="name" placeholder="Your Name" required >
            <input type="tel" name="phone" placeholder="Phone Number" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <select name="treatment" required>
                <option multiple>Select Treatment</option>
                <option multiple>Hydration Facial</option>
                <option>Acne Treatment</option>
                <option>Chemical Peel</option>
                <option>Microneedling</option>
                <option>Skin Rejuvenation</option>
                <option>Body Treatment</option>
            </select>            <br><br>
            <button type="submit" class="book" style="color: blue;">Book Appointment</button>
        </form> <br>
        <p class="p">For more information, contact us at ==> <a href="contact.html">Blinx Contact</a></p>
        <footer style="color: white;">
            ©2026 Blinx Aesthetics. <br>
            <a href="index.html">HOME</a>
        </footer>
    
    <script src="script.js" ></script>
    
</body>
</html>
